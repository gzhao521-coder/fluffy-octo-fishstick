<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="成长">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="成长">
  <meta name="msapplication-TileColor" content="#0f0f23">
  <meta name="msapplication-navbutton-color" content="#0f0f23">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%230f0f23'/%3E%3Ctext x='90' y='110' font-size='90' text-anchor='middle'%3E🌱%3C/text%3E%3C/svg%3E">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%230f0f23'/%3E%3Ctext x='90' y='110' font-size='90' text-anchor='middle'%3E🌱%3C/text%3E%3C/svg%3E">
  <link rel="manifest" id="manifestLink">
  <title>成长</title>
  <style>
    :root {
      --bg: #0f0f23;
      --card: rgba(255,255,255,0.06);
      --card-solid: #1a1a2e;
      --text: #f0f0f5;
      --text2: #8892b0;
      --primary: #64ffda;
      --primary-dim: rgba(100,255,218,0.15);
      --accent1: #bd34fe;
      --accent2: #00d4ff;
      --accent3: #ff6b6b;
      --accent4: #ffd93d;
      --accent5: #6bcb77;
      --accent6: #4d96ff;
      --accent7: #ff9f43;
      --success: #00e676;
      --danger: #ff5252;
      --warning: #ffd740;
      --radius-sm: 12px;
      --radius: 20px;
      --radius-lg: 28px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(100,255,218,0.1); }
      50% { box-shadow: 0 0 40px rgba(100,255,218,0.3); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes scaleIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes checkBurst {
      0% { transform: scale(1); }
      30% { transform: scale(0.8); }
      50% { transform: scale(1.2); }
      70% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-60px) rotate(360deg); opacity: 0; }
    }
    @keyframes ringExpand {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    @keyframes numberPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    @keyframes gradientText {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    @keyframes orbit {
      0% { transform: rotate(0deg) translateX(80px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(80px) rotate(-360deg); }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #0f0f23 25%, #1a0a2e 50%, #0f0f23 75%, #0a0a1a 100%);
      background-size: 400% 400%;
      animation: bgShift 20s ease infinite;
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 90px;
      position: relative;
      overflow-x: hidden;
    }

    /* 装饰光球 */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: breathe 6s ease-in-out infinite;
    }
    .orb-1 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(100,255,218,0.12), transparent 70%); top: -100px; right: -80px; animation-delay: 0s; }
    .orb-2 { width: 250px; height: 250px; background: radial-gradient(circle, rgba(189,52,254,0.1), transparent 70%); bottom: 100px; left: -100px; animation-delay: 2s; }
    .orb-3 { width: 200px; height: 200px; background: radial-gradient(circle, rgba(0,212,255,0.08), transparent 70%); top: 40%; right: -60px; animation-delay: 4s; }

    /* 网格背景 */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(100,255,218,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100,255,218,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      background: rgba(15,15,35,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 20px 20px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(100,255,218,0.08);
    }
    header h1 {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(90deg, #64ffda, #bd34fe, #00d4ff, #64ffda);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 3px;
      animation: gradientText 6s ease infinite;
    }
    header .date {
      font-size: 12px;
      color: var(--text2);
      margin-top: 4px;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .container { max-width: 680px; margin: 0 auto; padding: 20px 16px; position: relative; z-index: 1; }

    /* 统计卡片 - 玻璃拟态 */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 18px 8px;
      text-align: center;
      border: 1px solid rgba(100,255,218,0.08);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      animation: slideUp 0.5s ease backwards;
    }
    .stat-card:nth-child(1) { animation-delay: 0.1s; }
    .stat-card:nth-child(2) { animation-delay: 0.2s; }
    .stat-card:nth-child(3) { animation-delay: 0.3s; }
    .stat-card:hover {
      transform: translateY(-4px);
      border-color: rgba(100,255,218,0.2);
      box-shadow: 0 8px 32px rgba(100,255,218,0.1);
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      opacity: 0.6;
    }
    .stat-card .icon-wrap {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 8px;
      font-size: 18px;
      background: rgba(100,255,218,0.1);
      border: 1px solid rgba(100,255,218,0.15);
      animation: float 3s ease-in-out infinite;
    }
    .stat-card:nth-child(1) .icon-wrap { animation-delay: 0s; }
    .stat-card:nth-child(2) .icon-wrap { animation-delay: 0.5s; background: rgba(0,230,118,0.1); border-color: rgba(0,230,118,0.15); }
    .stat-card:nth-child(3) .icon-wrap { animation-delay: 1s; background: rgba(255,215,64,0.1); border-color: rgba(255,215,64,0.15); }
    .stat-card .num {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      transition: all 0.3s ease;
    }
    .stat-card .num.pop { animation: numberPop 0.4s ease; }
    .stat-card .label { font-size: 11px; color: var(--text2); margin-top: 4px; font-weight: 500; letter-spacing: 0.5px; }

    /* 模块标题 */
    .module-title-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 0 4px;
      animation: slideUp 0.4s ease backwards;
      animation-delay: 0.2s;
    }
    .module-title-bar .m-icon {
      width: 44px; height: 44px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .module-title-bar .m-icon::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      border-radius: inherit;
    }
    .module-title-bar .m-text { flex: 1; }
    .module-title-bar .m-text .m-name { font-size: 18px; font-weight: 700; color: var(--text); }
    .module-title-bar .m-text .m-desc { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .module-title-bar .m-progress {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* 添加框 */
    .add-box {
      background: var(--card);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      border: 1px solid rgba(100,255,218,0.08);
      animation: slideUp 0.4s ease backwards;
      animation-delay: 0.3s;
      transition: all 0.3s ease;
    }
    .add-box:focus-within {
      border-color: rgba(100,255,218,0.25);
      box-shadow: 0 0 20px rgba(100,255,218,0.08);
    }
    .add-box input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid rgba(100,255,218,0.1);
      border-radius: var(--radius-sm);
      font-size: 15px;
      outline: none;
      background: rgba(0,0,0,0.2);
      color: var(--text);
      transition: all 0.3s ease;
    }
    .add-box input::placeholder { color: #5a5a7a; }
    .add-box input:focus { border-color: var(--primary); background: rgba(0,0,0,0.3); box-shadow: 0 0 15px rgba(100,255,218,0.1); }
    .add-box button {
      padding: 12px 22px;
      background: linear-gradient(135deg, var(--primary), var(--accent2));
      color: #0a0a1a;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(100,255,218,0.3);
      position: relative;
      overflow: hidden;
    }
    .add-box button::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transform: rotate(30deg);
      transition: all 0.5s ease;
    }
    .add-box button:hover::after { left: 100%; }
    .add-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(100,255,218,0.4);
    }
    .add-box button:active { transform: translateY(0); }

    /* 模块进度条 */
    .module-progress-bar {
      background: var(--card);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(100,255,218,0.06);
      animation: slideUp 0.4s ease backwards;
      animation-delay: 0.35s;
    }
    .module-progress-bar .ph {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .module-progress-bar .ph span { font-size: 13px; font-weight: 600; color: var(--text2); }
    .module-progress-bar .ph .pp { font-size: 14px; font-weight: 700; }
    .module-progress-bar .pb { height: 10px; background: rgba(0,0,0,0.3); border-radius: 5px; overflow: hidden; position: relative; }
    .module-progress-bar .pb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }
    .module-progress-bar .pf { height: 100%; border-radius: 5px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
    .module-progress-bar .pf::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }

    /* 打卡卡片 */
    .habit-list { display: flex; flex-direction: column; gap: 12px; }
    .habit-card {
      background: var(--card);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid rgba(100,255,218,0.06);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      animation: slideUp 0.4s ease backwards;
    }
    .habit-card:nth-child(1) { animation-delay: 0.4s; }
    .habit-card:nth-child(2) { animation-delay: 0.45s; }
    .habit-card:nth-child(3) { animation-delay: 0.5s; }
    .habit-card:nth-child(4) { animation-delay: 0.55s; }
    .habit-card:nth-child(5) { animation-delay: 0.6s; }
    .habit-card:nth-child(6) { animation-delay: 0.65s; }
    .habit-card:nth-child(7) { animation-delay: 0.7s; }
    .habit-card:nth-child(8) { animation-delay: 0.75s; }
    .habit-card:hover {
      transform: translateY(-3px);
      border-color: rgba(100,255,218,0.15);
      box-shadow: 0 8px 32px rgba(100,255,218,0.08);
    }
    .habit-card.done {
      border-color: rgba(0,230,118,0.2);
      background: rgba(0,230,118,0.05);
    }
    .habit-card.done:hover {
      box-shadow: 0 8px 32px rgba(0,230,118,0.1);
    }
    /* 左侧发光条 */
    .habit-card::before {
      content: '';
      position: absolute;
      left: 0; top: 8px; bottom: 8px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: linear-gradient(180deg, transparent, var(--text2), transparent);
      opacity: 0.3;
      transition: all 0.3s ease;
    }
    .habit-card:hover::before {
      opacity: 0.6;
      background: linear-gradient(180deg, transparent, var(--primary), transparent);
    }
    .habit-card.done::before {
      background: linear-gradient(180deg, transparent, var(--success), transparent);
      opacity: 0.8;
    }
    .habit-card .icon {
      width: 46px; height: 46px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      background: rgba(100,255,218,0.08);
      border: 1px solid rgba(100,255,218,0.1);
      transition: all 0.4s ease;
      position: relative;
    }
    .habit-card.done .icon {
      background: rgba(0,230,118,0.15);
      border-color: rgba(0,230,118,0.25);
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0,230,118,0.2);
    }
    .habit-info { flex: 1; min-width: 0; }
    .habit-info .name { font-size: 15px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .habit-info .meta {
      font-size: 12px;
      color: var(--text2);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .habit-info .streak { color: var(--warning); font-weight: 700; display: inline-flex; align-items: center; gap: 2px; }
    .habit-info .streak::before { content: '🔥'; font-size: 10px; }
    .cycle-badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700; color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .cycle-badge.rest { background: linear-gradient(135deg, #6c757d, #adb5bd); }
    .cycle-badge.work { background: linear-gradient(135deg, #4d96ff, #6bcb77); }
    .cycle-badge.night { background: linear-gradient(135deg, #bd34fe, #ff6b6b); }
    .cycle-badge.off { background: linear-gradient(135deg, #ff5252, #ff9f43); }
    .cycle-badge.feed { background: linear-gradient(135deg, #00e676, #00d4ff); }
    .cycle-badge.stop { background: #2d2d44; color: var(--text2); }
    .period-badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .period-badge.due { background: linear-gradient(135deg, #ffd740, #ff9f43); color: #1a1a2e; }
    .period-badge.wait { background: #2d2d44; color: var(--text2); }
    .note-tag {
      font-size: 11px; color: var(--primary); background: rgba(100,255,218,0.1);
      padding: 2px 8px; border-radius: 6px; margin-top: 3px; display: inline-block;
      border: 1px solid rgba(100,255,218,0.15);
    }

    /* 打卡按钮 */
    .check-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 2.5px solid rgba(100,255,218,0.15);
      background: rgba(0,0,0,0.2);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
      color: transparent;
      position: relative;
    }
    .check-btn::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: all 0.4s ease;
    }
    .check-btn:hover {
      border-color: var(--primary);
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(100,255,218,0.2);
    }
    .check-btn.done {
      background: linear-gradient(135deg, #00e676, #00d4ff);
      border-color: transparent;
      color: #0a0a1a;
      transform: scale(1.05);
      box-shadow: 0 4px 20px rgba(0,230,118,0.4);
      animation: checkBurst 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .check-btn.done::before {
      border-color: rgba(0,230,118,0.3);
      animation: ringExpand 1.5s ease-out;
    }
    .check-btn.disabled { opacity: 0.3; cursor: not-allowed; border-color: rgba(100,255,218,0.05); }
    .check-btn.disabled:hover { transform: none; box-shadow: none; border-color: rgba(100,255,218,0.05); }

    .del-btn {
      width: 28px; height: 28px;
      border: none; background: transparent;
      color: #4a4a6a; font-size: 16px;
      cursor: pointer; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease; flex-shrink: 0;
    }
    .del-btn:hover { color: var(--danger); background: rgba(255,82,82,0.1); }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10,10,26,0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 100;
      border-top: 1px solid rgba(100,255,218,0.08);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .nav-items {
      display: flex;
      justify-content: space-around;
      align-items: center;
      max-width: 680px;
      margin: 0 auto;
      padding: 4px 4px 8px;
      position: relative;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 2px;
      cursor: pointer;
      border-radius: 16px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      background: transparent;
      color: #5a5a7a;
      position: relative;
    }
    .nav-item:hover { color: var(--text2); background: rgba(100,255,218,0.05); }
    .nav-item.active { color: var(--primary); }
    .nav-item .nav-icon {
      font-size: 22px;
      line-height: 1;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      z-index: 2;
    }
    .nav-item.active .nav-icon { transform: translateY(-4px) scale(1.2); filter: drop-shadow(0 4px 8px rgba(100,255,218,0.4)); }
    .nav-item .nav-label {
      font-size: 9px;

    .supplement-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .supplement-check-btn {
      width: 40px; height: 40px;
      border-radius: 50%;

<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-bg"></div>

  <header>
    <h1>成长</h1>
    <div class="date" id="todayDate"></div>
  </header>

  <div class="container">
    <div class="stats" id="statsBox">

        <div class="label">完成率</div>
      </div>
    </div>

    <div id="moduleContent"></div>
  </div>

  <nav class="bottom-nav">

  </nav>

  <div class="overlay" id="overlay" onclick="closeModal(event)">

        <h3 id="modalTitle">打卡记录</h3>
        <button class="close" onclick="closeModal()">&times;</button>
      </div>
      <div class="calendar" id="calendar"></div>
    </div>
  </div>

  <div class="overlay" id="noteOverlay" onclick="closeNoteModal(event)">

      <div class="modal-header">
        <h3 id="noteModalTitle">记录数据</h3>

    function getTodayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function formatDateCN(d) {
      const week = ['周日','周一','周二','周三','周四','周五','周六'];
      return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${week[d.getDay()]}`;
    }

    function daysBetween(d1, d2) {
      const a = new Date(d1 + 'T00:00:00');
      const b = new Date(d2 + 'T00:00:00');
      return Math.floor((b - a) / (1000 * 60 * 60 * 24));
    }

    function getCycleState(habit, dateStr) {
      const diff = daysBetween(habit.cycleStart, dateStr);
      const idx = ((diff % habit.cycleLength) + habit.cycleLength) % habit.cycleLength;
      return habit.cycleStates[idx];
    }

    function isPeriodDay(habit, dateStr) {
      const diff = daysBetween(habit.baseDate, dateStr);
      return diff >= 0 && diff % habit.period === 0;
    }

    function getDaysUntilNext(habit, dateStr) {
      const diff = daysBetween(habit.baseDate, dateStr);
      if (diff < 0) return null;
      const mod = diff % habit.period;
      if (mod === 0) return 0;
      return habit.period - mod;
    }

    function getCycleStateClass(state) {
      const map = { '休息': 'rest', '白班': 'work', '夜班': 'night', '下夜班': 'off', '喂食': 'feed', '停喂': 'stop' };
      return map[state] || 'rest';
    }

    function getStreak(records) {
      if (!records || !records.length) return 0;
      const set = new Set(records);
      let d = new Date();
      let streak = 0;
      const todayStr = getTodayStr();
      if (!set.has(todayStr)) { d.setDate(d.getDate() - 1); }
      while (true) {
        const s = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        if (set.has(s)) { streak++; d.setDate(d.getDate() - 1); }
        else break;
      }
      return streak;
    }

    function formatMoney(num) {
      return '¥' + Number(num).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function getFinanceStats() {
      const fin = data.modules.finance;
      const target = fin.targetAmount || 0;
      const current = fin.currentAmount || 0;
      const pct = target > 0 ? Math.min(100, Math.round(current / target * 100)) : 0;
      const remaining = Math.max(0, target - current);
      const txs = fin.transactions || [];
      const monthIncome = txs.filter(t => {
        const d = new Date(t.date + 'T00:00:00');
        const now = new Date();
        return t.type === 'income' && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      }).reduce((s, t) => s + t.amount, 0);
      const monthExpense = txs.filter(t => {
        const d = new Date(t.date + 'T00:00:00');
        const now = new Date();
        return t.type === 'expense' && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      }).reduce((s, t) => s + t.amount, 0);
      return { target, current, pct, remaining, txs, monthIncome, monthExpense };
    }

    function saveTransaction() {
      const type = document.getElementById('txType').value;
      const amount = parseFloat(document.getElementById('txAmount').value);
      const note = document.getElementById('txNote').value.trim();
      if (isNaN(amount) || amount <= 0) { alert('请输入有效的金额'); return; }

      const tx = {
        id: Date.now(),
        type: type,
        amount: amount,
        note: note,
        date: getTodayStr()
      };
      data.modules.finance.transactions.unshift(tx);
      if (type === 'income') {
        data.modules.finance.currentAmount = (data.modules.finance.currentAmount || 0) + amount;
      } else {
        data.modules.finance.currentAmount = (data.modules.finance.currentAmount || 0) - amount;
      }
      saveData();
      closeTxModal();
      renderModule('finance');
      updateTotalStats();
    }

    function deleteTransaction(id) {
      if (!confirm('确定删除这条记录吗？')) return;
      const fin = data.modules.finance;
      const idx = fin.transactions.findIndex(t => t.id === id);
      if (idx >= 0) {
        const tx = fin.transactions[idx];
        if (tx.type === 'income') {
          fin.currentAmount -= tx.amount;
        } else {
          fin.currentAmount += tx.amount;
        }
        fin.transactions.splice(idx, 1);
        saveData();
        renderModule('finance');
        updateTotalStats();
      }
    }

    function autoFetchMarketData() {
      const fin = data.modules.finance;

      }
      // 静默获取，不弹错误提示

    function startMarketAutoRefresh() {
      if (marketRefreshTimer) clearInterval(marketRefreshTimer);
      marketRefreshTimer = setInterval(() => {
        const now = new Date();
        const hour = now.getHours();
        const min = now.getMinutes();
        const day = now.getDay();
        // 仅在工作日 9:00-15:30 自动刷新
        if (day >= 1 && day <= 5 && ((hour === 9 && min >= 0) || (hour > 9 && hour < 15) || (hour === 15 && min <= 30))) {
          refreshMarketData(true);
        }
      }, 300000); // 每5分钟检查一次
    }

    // 腾讯财经接口作为备选
    const TENCENT_INDEX_MAP = {
      '000001': { name: '上证指数', code: '000001', tencent: 'sh000001' },
      '399001': { name: '深证成指', code: '399001', tencent: 'sz399001' },
      '399006': { name: '创业板指', code: '399006', tencent: 'sz399006' },
      '000300': { name: '沪深300', code: '000300', tencent: 'sh000300' }
    };

    function fetchMarketData() {
      return new Promise((resolve, reject) => {
        // 先尝试东方财富
        tryEastMoney().then(resolve).catch(err1 => {
          console.log('东方财富获取失败，尝试腾讯财经:', err1);
          // fallback 到腾讯财经
          tryTencent().then(resolve).catch(err2 => {
            reject(new Error('所有数据源均失败: ' + err1.message + '; ' + err2.message));
          });
        });
      });
    }

    function tryEastMoney() {
      return new Promise((resolve, reject) => {
        const cb = 'jQuery' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        const script = document.createElement('script');
        const timeout = setTimeout(() => { cleanup(); reject(new Error('东方财富请求超时')); }, 8000);
        function cleanup() { clearTimeout(timeout); if (script.parentNode) script.parentNode.removeChild(script); delete window[cb]; }
        window[cb] = function(data) {
          cleanup();
          if (data && data.data && data.data.diff && data.data.diff.length > 0) {
            const records = data.data.diff.map(item => ({
              name: item.f14,
              code: item.f12,
              price: parseFloat(item.f2),
              change: parseFloat(item.f4),
              changePct: parseFloat(item.f3),
              prevClose: parseFloat(item.f18)
            })).filter(r => !isNaN(r.price) && r.price > 0);
            if (records.length > 0) resolve(records);
            else reject(new Error('东方财富返回数据为空'));
          } else {
            reject(new Error('东方财富数据格式错误'));
          }
        };
        script.onerror = function() { cleanup(); reject(new Error('东方财富脚本加载失败')); };
        const fields = 'f2,f3,f4,f12,f14,f18';
        const secids = INDEX_CONFIG.map(c => c.code).join(',');
        script.src = `https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&invt=2&fields=${fields}&secids=${secids}&ut=fa5fd1943c7b386f172d6893dbfba10b&_=${Date.now()}&callback=${cb}`;
        document.head.appendChild(script);
      });
    }

    function tryTencent() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        const timeout = setTimeout(() => { cleanup(); reject(new Error('腾讯财经请求超时')); }, 8000);
        function cleanup() { clearTimeout(timeout); if (script.parentNode) script.parentNode.removeChild(script); }
        script.onerror = function() { cleanup(); reject(new Error('腾讯财经脚本加载失败')); };
        script.onload = function() {
          cleanup();
          try {
            const records = [];
            Object.keys(TENCENT_INDEX_MAP).forEach(key => {
              const cfg = TENCENT_INDEX_MAP[key];
              const varName = 'v_' + cfg.tencent;
              if (window[varName]) {
                const parts = window[varName].split('~');
                if (parts.length >= 5) {
                  const price = parseFloat(parts[3]);
                  const prevClose = parseFloat(parts[4]);
                  const change = price - prevClose;
                  const changePct = prevClose > 0 ? (change / prevClose * 100) : 0;
                  if (!isNaN(price) && price > 0) {
                    records.push({ name: cfg.name, code: cfg.code, price, change, changePct, prevClose });
                  }
                }
              }
            });

    function drawMarketCharts() {
      const fin = data.modules.finance;
      const marketData = fin.marketData || {};
      const dates = Object.keys(marketData).sort().slice(-7);
      if (dates.length < 2) return;
      INDEX_CONFIG.forEach((cfg, idx) => {
        const canvas = document.getElementById(`marketChart_${idx}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        const prices = [];
        dates.forEach(date => {
          const dayData = marketData[date];
          const item = dayData.find(d => d.code === cfg.marketCode);
          if (item && !isNaN(item.price)) prices.push(item.price);
        });
        if (prices.length < 2) return;
        const w = rect.width, h = rect.height;
        const pad = { top: 10, right: 10, bottom: 20, left: 10 };
        const cw = w - pad.left - pad.right;
        const ch = h - pad.top - pad.bottom;
        const min = Math.min(...prices);
        const max = Math.max(...prices);
        const range = max - min || 1;
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = 'rgba(100,255,218,0.06)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= 3; i++) {
          const y = pad.top + ch * i / 3;
          ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
        }
        const isUp = prices[prices.length - 1] >= prices[0];
        const lineColor = isUp ? '#ff5252' : '#00e676';
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        prices.forEach((p, i) => {
          const x = pad.left + cw * i / (prices.length - 1);
          const y = pad.top + ch * (1 - (p - min) / range);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.fillStyle = isUp ? 'rgba(255,82,82,0.08)' : 'rgba(0,230,118,0.08)';
        ctx.beginPath();
        prices.forEach((p, i) => {
          const x = pad.left + cw * i / (prices.length - 1);
          const y = pad.top + ch * (1 - (p - min) / range);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.lineTo(pad.left + cw, pad.top + ch);
        ctx.lineTo(pad.left, pad.top + ch);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = lineColor;
        prices.forEach((p, i) => {
          const x = pad.left + cw * i / (prices.length - 1);
          const y = pad.top + ch * (1 - (p - min) / range);
          ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill();
        });
        const lastPrice = prices[prices.length - 1];
        const lastY = pad.top + ch * (1 - (lastPrice - min) / range);
        ctx.fillStyle = lineColor;
        ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(lastPrice.toFixed(0), w - pad.right, lastY - 6);
      });
    }

        window[callbackName] = function(data) {

          if (data && data.fundcode) {

        const recordsHtml = isExpanded && recordCount > 0 ? `
          <div class="manifest-records">
            ${goal.records.map(r => `
              <div class="manifest-record-item">
                <div class="manifest-record-header">
                  <span class="manifest-record-date">📅 ${r.date}</span>
                  <button class="manifest-record-del" onclick="deleteManifestRecord(${goal.id}, ${r.id})" title="删除">×</button>
                </div>
                ${r.content ? `<div class="manifest-record-content">${r.content}</div>` : ''}
                ${r.signs ? `<div class="manifest-record-signs">🔮 迹象：${r.signs}</div>` : ''}
                ${r.gratitude ? `<div class="manifest-record-gratitude">🙏 感恩：${r.gratitude}</div>` : ''}
              </div>
            `).join('')}
          </div>
        ` : '';

        return `
          <div class="manifest-goal-card ${isAchieved ? 'achieved' : ''}">
            <div class="manifest-goal-main" onclick="toggleManifestExpand(${goal.id})">
              <div class="manifest-goal-left">
                <div class="manifest-goal-icon">${isAchieved ? '✅' : '✨'}</div>
                <div class="manifest-goal-info">
                  <div class="manifest-goal-title">${goal.title}</div>
                  <div class="manifest-goal-meta">
                    ${goal.targetDate ? '<span>🎯 ' + goal.targetDate + '</span>' : ''}
                    ${recordCount > 0 ? '<span>📝 ' + recordCount + ' 条记录</span>' : ''}
                    ${isAchieved && goal.achievedAt ? '<span style="color:var(--success)">🎉 ' + goal.achievedAt + ' 实现</span>' : ''}
                  </div>
                  ${goal.description ? `<div class="manifest-goal-desc">${goal.description}</div>` : ''}
                </div>
              </div>
              <div class="manifest-goal-actions">
                <button class="manifest-goal-btn ${isAchieved ? 'active' : ''}" onclick="event.stopPropagation(); toggleManifestGoalStatus(${goal.id})" title="${isAchieved ? '标记为进行中' : '标记为实现'}">${isAchieved ? '↩️' : '✅'}</button>
                <button class="manifest-goal-btn" onclick="event.stopPropagation(); openManifestRecordModal(${goal.id})" title="添加记录">➕</button>
                <button class="manifest-goal-btn del" onclick="event.stopPropagation(); deleteManifestGoal(${goal.id})" title="删除">🗑️</button>
              </div>
            </div>
            ${recordsHtml}
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="module-title-bar">
          <div class="m-icon" style="background:${cfg.bg};border:1px solid ${cfg.color}22">${cfg.icon}</div>
          <div class="m-text">
            <div class="m-name">${cfg.name}</div>
            <div class="m-desc">${cfg.desc}</div>
          </div>
          <div class="m-progress">${goals.length}</div>
        </div>

        <div class="stats manifest-stats">
          <div class="stat-card">
            <div class="icon-wrap">✨</div>
            <div class="num">${activeCount}</div>
            <div class="label">进行中</div>
          </div>
          <div class="stat-card">
            <div class="icon-wrap">✅</div>
            <div class="num">${achievedCount}</div>
            <div class="label">已实现</div>
          </div>
          <div class="stat-card">
            <div class="icon-wrap">📝</div>
            <div class="num">${totalRecords}</div>
            <div class="label">总记录</div>
          </div>
        </div>

        <div class="add-box">
          <input type="text" id="manifestGoalInput" placeholder="添加显化目标..." maxlength="30"
            onkeypress="if(event.key==='Enter') addManifestGoal()">
          <button onclick="addManifestGoal()">添加</button>
        </div>

        ${hasGoals ? `
          <div class="manifest-goals-list">
            ${goalsHtml}
          </div>
        ` : `
          <div class="empty-state">
            <div class="big">✨</div>
            <p>还没有显化目标，添加一个开始吧</p>
            <p style="font-size:12px;color:var(--text2);margin-top:4px">写下你的愿望，宇宙正在聆听</p>
          </div>
        `}
      `;
    }


    // ========== 补剂明细 ==========
    const SUPPLEMENT_TIME_SLOTS = {
      morning: { label: '☀️ 早晨', color: '#ffd740', order: 1 },
      noon: { label: '🌤️ 中午', color: '#ff9f43', order: 2 },
      evening: { label: '🌙 晚上', color: '#bd34fe', order: 3 },
      workout: { label: '💪 运动', color: '#00e676', order: 4 }
    };

    function toggleSupplement(id) {
      const mod = data.modules.supplements;
      const item = mod.items.find(i => i.id === id);
      if (!item) return;
      item.taken = !item.taken;
      if (item.taken) {
        if (!item.records) item.records = [];
        item.records.push({ date: getTodayStr(), taken: true });
        if (item.records.length > 30) item.records = item.records.slice(-30);
      }
      saveData();
      renderModule('supplements');
      updateTotalStats();
      renderNav();
    }

    function addSupplement() {
      const input = document.getElementById('supplementInput');
      const name = input.value.trim();
      if (!name) return;
      const mod = data.modules.supplements;
      if (!mod.items) mod.items = [];
      mod.items.push({
        id: Date.now(),
        name: name,
        icon: '💊',
        dosage: '',
        time: '随餐',
        timeSlot: 'noon',
        taken: false,
        note: '',
        warning: ''
      });
      saveData();
      input.value = '';
      renderModule('supplements');
      updateTotalStats();
      renderNav();
    }

    function deleteSupplement(id) {
      if (!confirm('确定删除这个补剂吗？')) return;
      data.modules.supplements.items = data.modules.supplements.items.filter(i => i.id !== id);
      saveData();
      renderModule('supplements');
      updateTotalStats();
      renderNav();
    }

    function renderSupplementsModule(container) {
      const mod = data.modules.supplements;
      const items = mod.items || [];
      const cfg = MODULE_CONFIG.supplements;

      const takenCount = items.filter(i => i.taken).length;
      const totalCount = items.length;
      const pct = totalCount ? Math.round(takenCount / totalCount * 100) : 0;

      // 按时间段分组
      const grouped = {};
      Object.keys(SUPPLEMENT_TIME_SLOTS).forEach(k => grouped[k] = []);
      items.forEach(item => {
        const slot = item.timeSlot || 'noon';
        if (!grouped[slot]) grouped[slot] = [];
        grouped[slot].push(item);
      });

      let groupsHtml = '';
      Object.entries(SUPPLEMENT_TIME_SLOTS).sort((a, b) => a[1].order - b[1].order).forEach(([slotKey, slotInfo]) => {
        const slotItems = grouped[slotKey] || [];
        if (slotItems.length === 0) return;

        const slotTaken = slotItems.filter(i => i.taken).length;
        groupsHtml += `
          <div class="supplement-group">
            <div class="supplement-group-header" style="border-left-color:${slotInfo.color}">
              <span class="supplement-group-label" style="color:${slotInfo.color}">${slotInfo.label}</span>
              <span class="supplement-group-count">${slotTaken}/${slotItems.length}</span>
            </div>
            <div class="supplement-items">
              ${slotItems.map(item => `
                <div class="supplement-item ${item.taken ? 'taken' : ''}">
                  <div class="supplement-item-main">
                    <div class="supplement-item-icon">${item.icon}</div>
                    <div class="supplement-item-info">
                      <div class="supplement-item-name">${item.name}</div>
                      <div class="supplement-item-meta">
                        <span class="supplement-dosage">${item.dosage}</span>
                        <span class="supplement-time">⏰ ${item.time}</span>
                      </div>
                      ${item.note ? `<div class="supplement-note">💡 ${item.note}</div>` : ''}
                      ${item.warning ? `<div class="supplement-warning">⚠️ ${item.warning}</div>` : ''}
                    </div>
                  </div>
                  <div class="supplement-item-actions">
                    <button class="supplement-check-btn ${item.taken ? 'taken' : ''}" onclick="toggleSupplement(${item.id})" title="${item.taken ? '取消' : '已服用'}">
                      ${item.taken ? '✓' : ''}
                    </button>
                    <button class="supplement-del-btn" onclick="deleteSupplement(${item.id})" title="删除">×</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="module-title-bar">
          <div class="m-icon" style="background:${cfg.bg};border:1px solid ${cfg.color}22">${cfg.icon}</div>
          <div class="m-text">
            <div class="m-name">${cfg.name}</div>
            <div class="m-desc">${cfg.desc}</div>
          </div>
          <div class="m-progress">${pct}%</div>
        </div>

        <div class="module-progress-bar">
          <div class="ph"><span>今日服用进度</span><span class="pp" style="color:${cfg.color}">${takenCount}/${totalCount}</span></div>
          <div class="pb"><div class="pf" style="width:${pct}%;background:linear-gradient(90deg,${cfg.color},${cfg.color}66)"></div></div>
        </div>

        <div class="add-box">
          <input type="text" id="supplementInput" placeholder="添加新补剂..." maxlength="30"
            onkeypress="if(event.key==='Enter') addSupplement()">
          <button onclick="addSupplement()">添加</button>
        </div>

        ${totalCount > 0 ? groupsHtml : `
          <div class="empty-state">
            <div class="big">💊</div>
            <p>还没有添加补剂</p>
            <p style="font-size:12px;color:var(--text2);margin-top:4px">上方输入框添加你的第一瓶补剂</p>
          </div>
        `}
      `;
    }

    function toggleCheck(moduleId, id) {
      const h = data.modules[moduleId].habits.find(x => x.id === id);
      if (!h) return;

      if (h.type === 'period' && isPeriodDay(h, today) && !h.records.includes(today)) {
        if (h.name === '起飞') {
          pendingNoteId = id;
          pendingNoteModule = moduleId;
          document.getElementById('noteModalTitle').textContent = '🚀 起飞 — 记录数据';
          document.getElementById('noteInput').value = h.notes && h.notes[today] ? h.notes[today] : '';
          document.getElementById('noteOverlay').classList.add('show');
          return;
        }
      }

      doToggle(moduleId, id);
    }

    function doToggle(moduleId, id, note) {
      const h = data.modules[moduleId].habits.find(x => x.id === id);
      if (!h) return;
      const wasDone = h.records.includes(today);
      const idx = h.records.indexOf(today);
      if (idx >= 0) {
        h.records.splice(idx, 1);
        if (h.notes) delete h.notes[today];
      } else {
        h.records.push(today);
        if (note && h.notes !== undefined) h.notes[today] = note;
      }
      saveData();
      renderModule(activeModule);
      updateTotalStats();
      renderNav();

      // 打卡成功触发彩带
      if (!wasDone && h.records.includes(today)) {
        const btn = document.activeElement;
        if (btn) {
          const rect = btn.getBoundingClientRect();
          spawnConfetti(rect.left + rect.width/2, rect.top + rect.height/2);
        }
      }
    }

    function confirmNote() {
      const note = document.getElementById('noteInput').value.trim();
      if (pendingNoteId && pendingNoteModule) {
        doToggle(pendingNoteModule, pendingNoteId, note);
      }
      closeNoteModal();
    }

    function closeNoteModal(e) {
      if (e && e.target !== document.getElementById('noteOverlay')) return;
      document.getElementById('noteOverlay').classList.remove('show');
      pendingNoteId = null;
      pendingNoteModule = null;
    }

    function deleteHabit(moduleId, id) {
      if (!confirm('确定删除这个目标吗？历史记录也会一并删除。')) return;
      data.modules[moduleId].habits = data.modules[moduleId].habits.filter(x => x.id !== id);
      saveData();
      renderModule(activeModule);
      updateTotalStats();
      renderNav();
    }

    function renderModule(moduleId) {
      const container = document.getElementById('moduleContent');
      const mod = data.modules[moduleId];
      const cfg = MODULE_CONFIG[moduleId];
      if (!mod) return;

      if (moduleId === 'finance') {
        renderFinanceModule(container);
        return;
      }
      if (moduleId === 'manifestation') {
        renderManifestationModule(container);
        return;
      }
      if (moduleId === 'supplements') {
        renderSupplementsModule(container);
        return;
      }

      let modNeed = 0, modDone = 0;
      const habitHtml = mod.habits.map(h => {
        if (h.type === 'cycle') {
          modNeed++; modDone++;
          return renderCycleItem(moduleId, h);
        } else if (h.type === 'period') {
          const isDue = isPeriodDay(h, today);
          const isDone = h.records.includes(today);
          if (isDue) { modNeed++; if (isDone) modDone++; }
          return renderPeriodItem(moduleId, h, isDue, isDone);
        } else {
          const isDone = h.records.includes(today);
          modNeed++; if (isDone) modDone++;
          const streak = getStreak(h.records);
          return renderDailyItem(moduleId, h, isDone, streak);
        }
      }).join('');

      const pct = modNeed ? Math.round(modDone / modNeed * 100) : 0;
      const hasHabits = mod.habits.length > 0;

      container.innerHTML = `
        <div class="module-title-bar">
          <div class="m-icon" style="background:${cfg.bg};border:1px solid ${cfg.color}22">${cfg.icon}</div>
          <div class="m-text">
            <div class="m-name">${cfg.name}</div>
            <div class="m-desc">${cfg.desc}</div>
          </div>
          <div class="m-progress">${pct}%</div>
        </div>

        <div class="add-box">
          <input type="text" id="moduleInput" placeholder="添加${cfg.name}目标..." maxlength="20"
            onkeypress="if(event.key==='Enter') addHabit()">
          <button onclick="addHabit()">添加</button>
        </div>

        ${hasHabits ? `
          <div class="module-progress-bar">
            <div class="ph"><span>模块进度</span><span class="pp" style="color:${cfg.color}">${modDone}/${modNeed}</span></div>
            <div class="pb"><div class="pf" style="width:${pct}%;background:linear-gradient(90deg,${cfg.color},${cfg.color}66)"></div></div>
          </div>
          <div class="habit-list">
            ${habitHtml}
          </div>
        ` : `
          <div class="empty-state">
            <div class="big">🌱</div>
            <p>还没有目标，添加一个开始吧</p>
          </div>
        `}
      `;
      setTimeout(() => drawMarketCharts(), 100);
    }

    function renderDailyItem(moduleId, h, isDone, streak) {
      return `
        <div class="habit-card ${isDone ? 'done' : ''}">
          <div class="icon">${h.icon}</div>
          <div class="habit-info" onclick="showCalendar('${moduleId}', ${h.id})" style="cursor:pointer">
            <div class="name">${h.name}</div>
            <div class="meta">
              <span>${h.records.length} 天已坚持</span>
              ${streak > 0 ? '<span>·</span><span class="streak">' + streak + ' 天</span>' : ''}
            </div>
          </div>
          <button class="check-btn ${isDone ? 'done' : ''}" onclick="toggleCheck('${moduleId}', ${h.id})" title="点击打卡">
            ${isDone ? '✓' : ''}
          </button>
          <button class="del-btn" onclick="deleteHabit('${moduleId}', ${h.id})" title="删除">×</button>
        </div>
      `;
    }

    function renderCycleItem(moduleId, h) {
      const state = getCycleState(h, today);
      const stateClass = getCycleStateClass(state);
      const previews = [];
      const d = new Date();
      for (let i = 1; i <= 3; i++) {
        d.setDate(d.getDate() + 1);
        const ds = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        const s = getCycleState(h, ds);
        const dayLabel = i === 1 ? '明天' : i === 2 ? '后天' : '大后天';
        previews.push(`${dayLabel}${s}`);
      }
      d.setDate(d.getDate() - 3);

      return `
        <div class="habit-card">
          <div class="icon">${h.icon}</div>
          <div class="habit-info" onclick="showCycleCalendar('${moduleId}', ${h.id})" style="cursor:pointer">
            <div class="name">
              ${h.name}
              <span class="cycle-badge ${stateClass}">今日${state}</span>
            </div>
            <div class="meta">${previews.join(' · ')}</div>
          </div>
          <button class="del-btn" onclick="deleteHabit('${moduleId}', ${h.id})" title="删除">×</button>
        </div>
      `;
    }

    function renderPeriodItem(moduleId, h, isDue, isDone) {
      const daysLeft = getDaysUntilNext(h, today);
      let statusHtml = '';
      let btnHtml = '';

      if (isDue) {
        statusHtml = `<span class="period-badge due">📅 今日需打卡</span>`;
        btnHtml = `<button class="check-btn ${isDone ? 'done' : ''}" onclick="toggleCheck('${moduleId}', ${h.id})" title="点击打卡">${isDone ? '✓' : ''}</button>`;
      } else {
        statusHtml = `<span class="period-badge wait">⏳ 无需打卡</span>`;
        btnHtml = `<button class="check-btn disabled" title="${daysLeft}天后需打卡" disabled>·</button>`;
      }

      const noteHtml = (isDone && h.notes && h.notes[today]) ? `<div class="note-tag">📝 ${h.notes[today]}</div>` : '';
      const nextDate = new Date();
      nextDate.setDate(nextDate.getDate() + daysLeft);
      const nextStr = `${nextDate.getMonth()+1}月${nextDate.getDate()}日`;

      return `
        <div class="habit-card ${isDone ? 'done' : ''}">
          <div class="icon">${h.icon}</div>
          <div class="habit-info" onclick="showCalendar('${moduleId}', ${h.id})" style="cursor:pointer">
            <div class="name">${h.name} ${statusHtml}</div>
            <div class="meta">
              <span>${h.records.length} 次已记录</span>
              ${!isDue ? '<span>·</span><span>下次 ' + nextStr + '（还有' + daysLeft + '天）</span>' : ''}
            </div>
            ${noteHtml}
          </div>
          ${btnHtml}
          <button class="del-btn" onclick="deleteHabit('${moduleId}', ${h.id})" title="删除">×</button>
        </div>
      `;
    }

    function updateTotalStats() {
      let totalHabits = 0, totalNeed = 0, totalDone = 0;
      for (const [modId, mod] of Object.entries(data.modules)) {
        if (modId === 'supplements') {
          if (mod.items) {
            totalHabits += mod.items.length;
            totalNeed += mod.items.length;
            totalDone += mod.items.filter(i => i.taken).length;
          }
          continue;
        }
        if (!mod.habits) continue;
        totalHabits += mod.habits.length;
        for (const h of mod.habits) {
          if (h.type === 'cycle') { totalNeed++; totalDone++; }
          else if (h.type === 'period') {
            if (isPeriodDay(h, today)) {
              totalNeed++;
              if (h.records.includes(today)) totalDone++;
            }
          } else {
            totalNeed++;
            if (h.records.includes(today)) totalDone++;
          }
        }
      }
      document.getElementById('sTotal').textContent = totalHabits;
      document.getElementById('sDone').textContent = totalDone;
      const rate = totalNeed ? Math.round(totalDone / totalNeed * 100) : 0;
      document.getElementById('sRate').textContent = rate + '%';
    }

    function showCalendar(moduleId, id) {
      const h = data.modules[moduleId].habits.find(x => x.id === id);
      if (!h) return;
      document.getElementById('modalTitle').textContent = h.icon + ' ' + h.name + ' — 本月记录';
      const set = new Set(h.records);
      const now = new Date();
      const y = now.getFullYear(), m = now.getMonth();
      const firstDay = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m+1, 0).getDate();

      let html = '<div class="cal-head">日</div><div class="cal-head">一</div><div class="cal-head">二</div><div class="cal-head">三</div><div class="cal-head">四</div><div class="cal-head">五</div><div class="cal-head">六</div>';
      for (let i = 0; i < firstDay; i++) html += '<div></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        const isToday = ds === today;
        const ok = set.has(ds);
        html += `<div class="cal-day ${ok ? 'ok' : ''} ${isToday ? 'today' : ''}">${d}</div>`;
      }
      document.getElementById('calendar').innerHTML = html;
      document.getElementById('overlay').classList.add('show');
    }

    function showCycleCalendar(moduleId, id) {
      const h = data.modules[moduleId].habits.find(x => x.id === id);
      if (!h || h.type !== 'cycle') return;
      document.getElementById('modalTitle').textContent = h.icon + ' ' + h.name + ' — 本月状态';
      const now = new Date();
      const y = now.getFullYear(), m = now.getMonth();
      const firstDay = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m+1, 0).getDate();

      let html = '<div class="cal-head">日</div><div class="cal-head">一</div><div class="cal-head">二</div><div class="cal-head">三</div><div class="cal-head">四</div><div class="cal-head">五</div><div class="cal-head">六</div>';
      for (let i = 0; i < firstDay; i++) html += '<div></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        const isToday = ds === today;
        const state = getCycleState(h, ds);
        const cls = getCycleStateClass(state);
        html += `<div class="cal-day cycle-${cls} ${isToday ? 'today' : ''}">${d}</div>`;
      }
      document.getElementById('calendar').innerHTML = html;
      document.getElementById('overlay').classList.add('show');
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('overlay')) return;
      document.getElementById('overlay').classList.remove('show');
    }
  </script>
</body>
</html>
